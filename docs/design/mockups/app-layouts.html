<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PD mockup: app layouts</title><style>body{background:#1c1c20;color:#ececf1;font-family:-apple-system,system-ui,sans-serif;padding:16px} h2{font-weight:600} .subtitle{color:#b9b6c0}</style>
<style>
  .row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
  .rowlbl{font-size:13px;color:#cfcad6;text-align:center;margin:18px 0 0;letter-spacing:.4px;text-transform:uppercase}
  .shot{display:flex;flex-direction:column;gap:8px;align-items:center}
  .cap{font-size:12.5px;color:#cfcad6;text-align:center}
  .phone{--bg:#F7F6F3;--surface:#FFFFFF;--ink:#17181C;--muted:#55565C;--line:#E6E4DF;--accent:#25304D;--accentSoft:#E4E7EF;
    --shadow:0 1px 2px rgba(20,20,30,.04),0 4px 14px rgba(20,20,30,.05);--me:#17181C;--meInk:#fff;--meMuted:rgba(255,255,255,.55);--code:#F1EFEA;
    width:240px;height:510px;border-radius:36px;background:var(--bg);color:var(--ink);box-shadow:0 0 0 9px #1c1c1f,0 18px 40px rgba(0,0,0,.3);
    overflow:hidden;position:relative;font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif}
  .phone.dark{--bg:#121316;--surface:#1B1C20;--ink:#ECEBE8;--muted:#A5A6AC;--line:#26272C;--accent:#B9C4DE;--accentSoft:#252A38;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);--me:#ECEBE8;--meInk:#121316;--meMuted:rgba(18,19,22,.5);--code:#16171A}
  .status{height:26px;display:flex;justify-content:space-between;padding:8px 22px 0;font-size:11px;font-weight:600}
  .serif{font-family:"New York","Iowan Old Style","Georgia",serif}
  code,.code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px}
  .code{display:block;background:var(--code);border-radius:9px;padding:7px 9px;margin:6px 0;line-height:1.45;white-space:pre-wrap}

  /* chat list home */
  .title{font-size:24px;padding:6px 16px 8px}
  .search{margin:0 14px 8px;background:var(--surface);border-radius:12px;padding:8px 11px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
  .item{display:flex;gap:10px;align-items:center;padding:8px 16px}
  .av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--accent);background:var(--accentSoft)}
  .av.orb{background:radial-gradient(circle at 34% 28%,#ffffff 0,#F3F1EC 26%,#DCE1EA 58%,#C9CFDB 82%,#E9DFD2 100%)}
  .dark .av.orb{background:radial-gradient(circle at 34% 28%,#F4F3F0 0,#D6D9E0 30%,#9DA6B9 66%,#5D667C 100%)}
  .body{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:8px}
  .l1{display:flex;justify-content:space-between;align-items:baseline}
  .l1 b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .l1 span{font-size:10.5px;color:var(--muted);flex:none;margin-left:6px}
  .l2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .l2 i{font-style:normal;color:var(--ink)}
  .fab{position:absolute;right:16px;bottom:66px;background:var(--accent);color:var(--bg);border-radius:16px;padding:11px 14px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .tabs{position:absolute;left:0;right:0;bottom:0;height:52px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:10.5px;color:var(--muted)}
  .tabs div{text-align:center} .tabs .on{color:var(--ink);font-weight:600}
  .tabs .ic{font-size:15px;display:block}
  .tabs .on .ic{background:var(--accentSoft);border-radius:10px;padding:1px 12px;color:var(--accent)}

  /* conversation screen */
  .ctop{display:flex;align-items:center;gap:8px;padding:6px 12px 8px;border-bottom:1px solid var(--line)}
  .ctop .av{width:28px;height:28px}
  .ctop b{font-size:13px;display:block} .ctop small{font-size:10.5px;color:var(--muted)}
  .day{text-align:center;font-size:10.5px;color:var(--muted);margin:8px 0 4px}
  .me,.ai{position:relative;font-size:13px;line-height:1.45;max-width:80%;width:fit-content;padding:7px 11px 16px}
  .me{margin:6px 12px 3px auto;background:var(--me);color:var(--meInk);border-radius:16px 16px 5px 16px}
  .ai{margin:6px auto 3px 12px;background:var(--surface);border-radius:16px 16px 16px 5px;box-shadow:var(--shadow)}
  .t{position:absolute;right:10px;bottom:4px;font-size:9.5px;color:var(--muted)} .me .t{color:var(--meMuted)}
  .fold{font-size:11px;color:var(--muted);margin-bottom:4px}
  .composer{position:absolute;left:10px;right:10px;bottom:12px;background:var(--surface);border-radius:20px;padding:9px 10px 9px 9px;font-size:13px;color:var(--muted);box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .composer .txt{padding:2px 4px 8px}
  .tools{display:flex;align-items:center;gap:6px}
  .plus{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--ink)}
  .think{font-size:11.5px;font-weight:600;border-radius:13px;padding:5px 9px;border:1.5px solid var(--line);color:var(--muted)}
  .send{margin-left:auto;width:27px;height:27px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:13px}

  /* settings */
  .top{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;font-size:13.5px;font-weight:600}
  .sh{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 16px 8px}
  .opts{display:flex;gap:10px;padding:0 14px}
  .opt{flex:1;background:var(--surface);border-radius:14px;padding:8px;box-shadow:var(--shadow);border:1.5px solid transparent}
  .opt.sel{border-color:var(--accent)}
  .mini{height:96px;border-radius:9px;background:var(--bg);display:flex;overflow:hidden;position:relative}
  .mini .sb{width:34%;background:var(--line);opacity:.7}
  .mini .mid{flex:1;display:grid;place-items:center}
  .mini .dot{width:14px;height:14px;border-radius:50%;background:var(--accentSoft)}
  .mini .list{flex:1;padding:7px 6px;display:flex;flex-direction:column;gap:6px}
  .mini .li{display:flex;gap:4px;align-items:center} .mini .li i{width:10px;height:10px;border-radius:50%;background:var(--accentSoft);flex:none}
  .mini .li u{height:5px;border-radius:3px;background:var(--line);flex:1;text-decoration:none}
  .opt b{display:block;font-size:12.5px;margin-top:7px} .opt span{font-size:10.5px;color:var(--muted)}
  .srow{margin:6px 14px;background:var(--surface);border-radius:12px;padding:10px 11px;font-size:13px;display:flex;justify-content:space-between;box-shadow:var(--shadow)}
  .srow span{color:var(--muted);font-size:12px}
</style>

<h2>Two app layouts: Sidebar and Chat list</h2>
<p class="subtitle">Sidebar is ChatGPT's (see everyday.html): home is a new chat, past chats live in a sidebar. Chat list is a messaging app's: home is your chats, each opens into its own conversation screen with bubbles.</p>

<div class="rowlbl">Light</div>
<div class="row" id="light"></div>
<div class="rowlbl">Dark</div>
<div class="row" id="dark"></div>

<template id="screens">
  <div class="shot"><div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="title serif">Chats</div>
    <div class="search">⌕ Search chats</div>
    <div class="item"><div class="av">W</div><div class="body"><div class="l1"><b>Portfolio bio</b><span>9:38</span></div><div class="l2"><i>Writer:</i> Here's a tighter version that leads with…</div></div></div>
    <div class="item"><div class="av">S</div><div class="body"><div class="l1"><b>Monstera brown edges</b><span>8:02</span></div><div class="l2">You: what about the soil?</div></div></div>
    <div class="item"><div class="av">D</div><div class="body"><div class="l1"><b>CV for the design role</b><span>Tue</span></div><div class="l2"><i>Deep:</i> The 2021 gap reads fine if you…</div></div></div>
    <div class="item"><div class="av">W</div><div class="body"><div class="l1"><b>Explain transformers simply</b><span>Mon</span></div><div class="l2"><i>Writer:</i> Think of attention as a spotlight…</div></div></div>
    <div class="item"><div class="av">S</div><div class="body"><div class="l1"><b>Weekend trip to Goa</b><span>Sun</span></div><div class="l2"><i>Swift:</i> Three beaches worth the drive…</div></div></div>
    <div class="fab">✎ New chat</div>
    <div class="tabs"><div class="on"><span class="ic">◐</span>Chats</div><div><span class="ic">▤</span>Models</div><div><span class="ic">⚙</span>Settings</div></div>
  </div><div class="cap">Home: your chats</div></div>

  <div class="shot"><div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="ctop">‹ <div class="av">W</div><div><b>Portfolio bio</b><small>Writer ⌄</small></div></div>
    <div class="day">Today</div>
    <div class="me">Make my bio shorter and warmer<span class="t">9:37</span></div>
    <div class="ai"><div class="fold">Thought for 2 s ›</div>Here's a tighter version that leads with what you make, not your titles:<br><br>"I design calm tools for busy people…"<span class="t">9:38 · 38 words/s</span></div>
    <div class="me">Perfect, one more line?<span class="t">9:39</span></div>
    <div class="composer"><div class="txt">Message Writer</div><div class="tools"><div class="plus">+</div><div class="think">Think</div><div class="send">↑</div></div></div>
  </div><div class="cap">A conversation</div></div>

  <div class="shot"><div class="phone">
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="top">‹ Appearance</div>
    <div class="sh">Layout</div>
    <div class="opts">
      <div class="opt"><div class="mini"><div class="sb"></div><div class="mid"><div class="dot"></div></div></div><b>Sidebar</b><span>Like ChatGPT</span></div>
      <div class="opt sel"><div class="mini"><div class="list"><div class="li"><i></i><u></u></div><div class="li"><i></i><u></u></div><div class="li"><i></i><u></u></div><div class="li"><i></i><u></u></div></div></div><b>Chat list</b><span>Like messages</span></div>
    </div>
    <div class="sh">Theme</div>
    <div class="srow">Theme<span>System</span></div>
  </div><div class="cap">Settings › Appearance</div></div>
</template>

<script>
  (function () {
    const t = document.getElementById('screens');
    for (const id of ['light', 'dark']) {
      const row = document.getElementById(id);
      row.appendChild(t.content.cloneNode(true));
      if (id === 'dark') row.querySelectorAll('.phone').forEach(p => p.classList.add('dark'));
    }
  })();
</script>
