# The checks that need no model and no device. Everything else (the native and contract tests against real GGUFs,
# the host end-to-end, the phone steps, the demo's instrumented runs) stays in sdk/scripts/check.sh and
# demo/scripts/check.sh, run locally: they need models and a phone this runner doesn't have.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK: "29.0.14206865"
  CMAKE: "4.1.2"

jobs:
  scripts:
    name: Host scripts against stubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # the whole history and the submodule: bench.sh names a build by the last commit under sdk/ and llama.cpp's tag
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: sdk/scripts/check.sh --only scripts

  # none of these reaches buildBackends (each command checked with --dry-run), so this job needs no Docker
  sdk:
    name: SDK API, lint, JVM tests, AARs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: NDK and CMake
        run: .github/scripts/android-packages.sh "ndk;${NDK}" "cmake;${CMAKE}"
      - uses: gradle/actions/setup-gradle@v4
      - name: Public API matches the reviewed dumps
        run: >
          ./gradlew -p sdk
          :llamabro:apiCheck :llamabro-typed:apiCheck :llamabro-testing:apiCheck
          :llamabro-hub:apiCheck :llamabro-hub-work:apiCheck :llamabro-hub-testing:apiCheck
      - name: Lint
        run: >
          ./gradlew -p sdk
          :llamabro:lintRelease :llamabro-testing:lintRelease :llamabro-hub:lintRelease
          :llamabro-hub-work:lintRelease :llamabro-hub-testing:lintRelease :llamabro-typed:lintRelease
      # the host-native tests skip without -Pllamabro.host.* (they need a host build and models)
      - name: JVM tests
        run: >
          ./gradlew -p sdk
          :llamabro:testDebugUnitTest :llamabro-testing:testDebugUnitTest
          :llamabro-hub:testDebugUnitTest :llamabro-hub-work:testDebugUnitTest :llamabro-hub-testing:testDebugUnitTest
          :llamabro-typed:testDebugUnitTest :llamabro-typed-ksp:test
      - name: AARs (the native build, with -Werror on the bridge)
        run: >
          ./gradlew -p sdk
          :llamabro:assembleRelease :llamabro-hub:assembleRelease :llamabro-hub-work:assembleRelease

  # The NPU and GPU backend modules, and the demo that includes them, build their native libraries in Qualcomm's
  # Snapdragon toolchain image (the buildBackends task, Docker, about 10 GB), so they share one job and one pull. The
  # quality check runs here too: qualityCheck depends on buildBackends (`./gradlew qualityCheck --dry-run` lists it).
  backends-and-demo:
    name: Quality, backends and demo, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Room for the toolchain image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: NDK and CMake
        run: .github/scripts/android-packages.sh "ndk;${NDK}" "cmake;${CMAKE}"
      - uses: gradle/actions/setup-gradle@v4
      # ktlint, detekt and the import check; detekt resolves types, so the core module configures its native build,
      # which patches the llama.cpp submodule
      - name: Quality check
        run: ./gradlew qualityCheck
      - name: Backend modules, lint and unit tests
        run: >
          ./gradlew -p sdk
          :llamabro-hexagon:lintRelease :llamabro-opencl:lintRelease :llamabro-hexagon:testDebugUnitTest
      - name: Demo unit tests
        run: ./gradlew :demo:designsystem:testDebugUnitTest :demo:app:testDebugUnitTest
      - name: Demo lint
        run: ./gradlew :demo:app:lintDebug :demo:designsystem:lintDebug
      - name: Demo APK
        run: ./gradlew :demo:app:assembleDebug
