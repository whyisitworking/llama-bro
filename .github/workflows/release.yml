# A release: CI's checks as the gate, then two jobs.
#   demo  the demo app's minified release APK, signed with the upload key in this repository's secrets, attached to a
#         GitHub release for a version tag (Google Play uploads are made by hand, from the maintainer's machine)
#   sdk   the SDK's nine modules and its BOM, signed and uploaded to the Maven Central Portal as a deployment that waits there:
#         nothing is public until the maintainer presses Publish in the Portal (D133, docs/publishing.md)
#
#   git tag 2.0.0-alpha && git push origin 2.0.0-alpha   both; the tag must be the catalog's llamabro version
#   Actions > Release > Run workflow                     the demo's APK and the SDK's signed local publication as
#                                                        workflow artifacts; no release, no upload
#
# The demo's secrets (Settings > Secrets and variables > Actions), all four or none:
#   LLAMABRO_KEYSTORE_BASE64     the upload keystore (.jks), base64-encoded: base64 -i upload.jks | pbcopy
#   LLAMABRO_KEYSTORE_PASSWORD   its password
#   LLAMABRO_KEY_ALIAS           the key's alias in it
#   LLAMABRO_KEY_PASSWORD        the key's password
# They become the Gradle properties demo/app/build.gradle.kts reads (LLAMABRO_UPLOAD_*), the same names the maintainer's
# ~/.gradle/gradle.properties sets. Without them the APK is signed with a throwaway debug key.
#
# The SDK's secrets (docs/publishing.md has how to make each):
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD   the Central Portal user token
#   SIGNING_KEY, SIGNING_KEY_PASSWORD                gpg --export-secret-keys --armor <KEYID>, and its passphrase
# Without them a tag's sdk job stops before uploading anything.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK: "29.0.14206865"
  CMAKE: "4.1.2"

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  demo:
    name: Demo release APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      # the demo includes the NPU and GPU backends, whose native libraries build in Qualcomm's toolchain image (CI's
      # backends-and-demo job does the same)
      - name: Room for the toolchain image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: NDK and CMake
        run: .github/scripts/android-packages.sh "ndk;${NDK}" "cmake;${CMAKE}"
      - uses: gradle/actions/setup-gradle@v5

      # a tag names the version; a manual run is 0.0.0 with the commit; the run number keeps every build's code higher
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then name="${GITHUB_REF_NAME}"; else name="0.0.0-${GITHUB_SHA::8}"; fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.LLAMABRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::No upload key in the secrets: the APK is signed with a debug key"
            exit 0
          fi
          keystore="${RUNNER_TEMP}/upload.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          echo "ORG_GRADLE_PROJECT_LLAMABRO_UPLOAD_STORE_FILE=${keystore}" >> "$GITHUB_ENV"

      - name: Build
        env:
          ORG_GRADLE_PROJECT_LLAMABRO_UPLOAD_STORE_PASSWORD: ${{ secrets.LLAMABRO_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LLAMABRO_UPLOAD_KEY_ALIAS: ${{ secrets.LLAMABRO_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LLAMABRO_UPLOAD_KEY_PASSWORD: ${{ secrets.LLAMABRO_KEY_PASSWORD }}
        run: >
          ./gradlew :demo:app:assembleRelease
          -Pdemo.versionName=${{ steps.version.outputs.name }}
          -Pdemo.versionCode=${{ steps.version.outputs.code }}

      - name: Name the APK and its checksum
        run: |
          mkdir -p out
          name="llama-bro-demo-${{ steps.version.outputs.name }}"
          cp demo/app/build/outputs/apk/release/app-release.apk "out/${name}.apk"
          # a name that never changes: the README links releases/latest/download/llama-bro-demo.apk
          cp "out/${name}.apk" out/llama-bro-demo.apk
          (cd out && sha256sum ./* > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Forget the upload key
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: llama-bro-demo-${{ steps.version.outputs.name }}
          path: out/
          if-no-files-found: error

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # the notes are the version's section of docs/release-notes.md, else GitHub's list of changes
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '$0 == v {on = 1; next} on && /^## / {exit} on' docs/release-notes.md > notes.md
          if [ -s notes.md ]; then
            printf '\nInstall: `implementation("io.github.whyisitworking:llamabro:%s")` from Maven Central.\n' \
              "${GITHUB_REF_NAME}" >> notes.md
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" out/* --title "Llama Bro ${GITHUB_REF_NAME}" "${notes[@]}" --verify-tag

  sdk:
    name: SDK to the Maven Central Portal
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # the backend modules build in Qualcomm's toolchain image, as in the demo job
      - name: Room for the toolchain image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: NDK and CMake
        run: .github/scripts/android-packages.sh "ndk;${NDK}" "cmake;${CMAKE}"
      - uses: gradle/actions/setup-gradle@v5

      # a published version can never change, so the tag must name exactly the version the build stamps
      - name: The tag is the SDK's version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^llamabro = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not the SDK version ${version} (gradle/libs.versions.toml)"
            exit 1
          fi

      - name: Upload a deployment to the Central Portal
        if: github.ref_type == 'tag'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
              ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!name}" ]; then
              echo "::error::${name#ORG_GRADLE_PROJECT_} is not set: see the secrets at the top of release.yml"
              exit 1
            fi
          done
          ./gradlew -p sdk publishToMavenCentral
          echo "::notice::Uploaded. Check and publish it at https://central.sonatype.com/publishing/deployments"

      # a manual run uploads nothing: it publishes to this runner's local repository, signed when the key is set,
      # and keeps the files for a look at what a tag would upload
      - name: What a tag would upload
        if: github.ref_type != 'tag'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # a missing secret arrives as an empty value, which Gradle would take as a key
          if [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKey}" ]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          fi
          ./gradlew -p sdk publishToMavenLocal
      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: llama-bro-sdk-maven-local
          path: ~/.m2/repository/io/github/whyisitworking/
          if-no-files-found: error
