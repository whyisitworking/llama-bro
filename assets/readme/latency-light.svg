<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 754" width="520" height="754" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Waiting times</title>
<desc id="desc">Model load time per chip, the time to stop a reply, to the first spoken audio, and to come back to a chat. Qwen3.5 4B on NPU 5.2 s; Qwen3.5 4B on GPU 40.3 s; Qwen3.5 4B on CPU 7.9 s; LFM3-Omni 2B on NPU 2.2 s; LFM3-Omni 2B on GPU 9.6 s; LFM3-Omni 2B on CPU 2.8 s; Stop a reply 85 ms; First spoken audio 378 ms; Back to a 3,000-token chat 8.3 s; Back to a 3,000-token chat 5.1 s.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B44F6"/><stop offset="1" stop-color="#F7883F"/></linearGradient></defs>
