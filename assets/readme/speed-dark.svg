<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 826" width="520" height="826" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="title">Speed on each chip</title>
<desc id="desc">Prompt reading and reply writing speed of Qwen3.5 4B and LFM3-Omni 2B on the NPU, GPU and CPU. Reading the prompt, 2,048 tokens; Qwen3.5 4B on NPU 934 t/s; Qwen3.5 4B on GPU 188 t/s; Qwen3.5 4B on CPU 64.5 t/s; LFM3-Omni 2B on NPU 2,358 t/s; LFM3-Omni 2B on GPU 490 t/s; LFM3-Omni 2B on CPU 167 t/s; Writing the reply, up to 128 tokens; Qwen3.5 4B on NPU 15.3 t/s; Qwen3.5 4B on GPU 15.1 t/s; Qwen3.5 4B on CPU 12.1 t/s; LFM3-Omni 2B on NPU 36.3 t/s; LFM3-Omni 2B on GPU 38.4 t/s; LFM3-Omni 2B on CPU 33.0 t/s.</desc>
<defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F7883F"/></linearGradient></defs>
