<title id="title">Every size, every chip</title>
<desc id="desc">Reply and prompt speed of six models on the NPU, GPU and CPU, and embedding and rerank throughput. Writing, up to 64 tokens; LFM2.5 230M on NPU 171 t/s; LFM2.5 230M on GPU 136 t/s; LFM2.5 230M on CPU 149 t/s; Qwen3.5 0.8B on NPU 53.4 t/s; Qwen3.5 0.8B on GPU 48.6 t/s; Qwen3.5 0.8B on CPU 46.8 t/s; LFM3 1.7B on NPU 34.1 t/s; LFM3 1.7B on GPU 33.5 t/s; LFM3 1.7B on CPU 32.6 t/s; Llama 3.2 3B on NPU 21.2 t/s; Llama 3.2 3B on GPU 17.0 t/s; Llama 3.2 3B on CPU 6.3 t/s; Gemma 3 4B on NPU 14.2 t/s; Gemma 3 4B on GPU 12.5 t/s; Gemma 3 4B on CPU 7.9 t/s; Qwen3.5 4B on NPU 15.3 t/s; Qwen3.5 4B on GPU 14.1 t/s; Qwen3.5 4B on CPU 11.5 t/s; Reading, 512-token prompt; LFM2.5 230M on NPU 7,299 t/s; LFM2.5 230M on GPU 2,243 t/s; LFM2.5 230M on CPU 168 t/s; Qwen3.5 0.8B on NPU 2,174 t/s; Qwen3.5 0.8B on GPU 531 t/s; Qwen3.5 0.8B on CPU 259 t/s; LFM3 1.7B on NPU 1,682 t/s; LFM3 1.7B on GPU 348 t/s; LFM3 1.7B on CPU 143 t/s; Llama 3.2 3B on NPU 1,392 t/s; Llama 3.2 3B on GPU 202 t/s; Llama 3.2 3B on CPU 69.2 t/s; Gemma 3 4B on NPU 172 t/s; Gemma 3 4B on GPU 152 t/s; Gemma 3 4B on CPU 48.6 t/s; Qwen3.5 4B on NPU 646 t/s; Qwen3.5 4B on GPU 126 t/s; Qwen3.5 4B on CPU 45.0 t/s; Search models, sentences per second; bge-small embed on NPU 108 sentences/s; bge-small embed on GPU 46.2 sentences/s; bge-small embed on CPU 41.6 sentences/s; jina-tiny rerank on NPU 227 sentences/s; jina-tiny rerank on GPU 106 sentences/s; jina-tiny rerank on CPU 69.4 sentences/s.</desc>
